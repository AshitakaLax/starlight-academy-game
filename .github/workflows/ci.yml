name: Project checks

on:
  push:
    branches:
      - main
      - chat-gpt-implementation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run regression tests
        run: npm test

      - name: Build the standalone HTML
        run: npm run build

      - name: Upload standalone HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: starlight-academy-html
          path: dist/starlight-academy.html
          if-no-files-found: error
          retention-days: 14

  offline-browser:
    name: Offline browser QA (Chrome and Edge)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Build standalone HTML
        run: npm run build

      - name: Install Playwright
        run: python -m pip install --upgrade pip playwright

      - name: Install branded Chrome and Edge
        run: python -m playwright install chrome msedge

      - name: Verify offline Chrome
        env:
          BROWSER_CHANNEL: chrome
          HTML_PATH: dist/starlight-academy.html
          REQUIRE_FILE_URL: "1"
        run: python scripts/offline-browser-qa.py

      - name: Verify offline Microsoft Edge
        env:
          BROWSER_CHANNEL: msedge
          HTML_PATH: dist/starlight-academy.html
          REQUIRE_FILE_URL: "1"
        run: python scripts/offline-browser-qa.py
